[tools]
python = "3.12"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.selftest]
description = "Validate normalize+diff on synthetic data (no Keynote needed)"
run = "python3 tools/selftest.py"

[tasks.test]
description = "Unit-test the Deck backend (no Keynote needed)"
run = "python3 tools/test_deckkit.py"

[tasks.build-example]
description = "Build + verify the example deck (needs Keynote + keynote-parser)"
run = "python3 tools/build_deck.py examples/deck_example.json samples/deck_example.key --verify"

[tasks.read-builds]
description = "Read object builds from .key file(s): mise run read-builds -- <file.key>... (needs keynote-parser)"
run = "python3 tools/read_builds.py"

[tasks.transitions]
description = "Experiment 1: transition present vs absent"
run = "python3 tools/run_experiment.py transitions --generate generators/transition_matrix.applescript"

[tasks.experiment]
description = "Run an arbitrary experiment: mise run experiment -- <name> [args...]"
run = "python3 tools/run_experiment.py"
