name: KeynoteKit

# CI on GitHub-hosted runners, following the BrightDigit pattern (SyndiKit is
# the reference). Scope is deliberately narrower than SyndiKit's: this package
# is Swift 6.4+ only, so there is no multi-version matrix and no source-compat
# leg, and no Windows/Android/wasm legs. What remains is macOS — the platform
# Keynote runs on — plus Ubuntu, which is what actually enforces the
# cross-platform constraint: only KeynoteKitScripting is Apple-only, and it is
# gated on canImport rather than a linked framework.
on:
  push:
    branches: [main, v0.1.x]
    tags: ['v*.*.*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'research/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'research/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: KeynoteKit

jobs:
  # Two tiers. Ordinary PRs get SPM-only on macOS (macos-spm.json); main,
  # semver branches, dispatch, and PRs into main add the platform/simulator
  # legs (macos-full.json). Matrix rows live in .github/matrices/ so they can
  # be edited without touching workflow logic.
  configure:
    name: Configure Matrix
    runs-on: ubuntu-latest
    outputs:
      macos-matrix: ${{ steps.matrix.outputs.macos-matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        name: Determine matrix scope
        run: |
          FULL=false
          REF="${{ github.ref }}"; EVENT="${{ github.event_name }}"; BASE_REF="${{ github.base_ref }}"
          if [[ "$REF" == "refs/heads/main" ]]; then FULL=true
          elif [[ "$REF" =~ ^refs/heads/v?[0-9]+\.[0-9]+\.[0-9x]+ ]]; then FULL=true
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then FULL=true
          elif [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "main" ]]; then FULL=true
            elif [[ "$BASE_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9x]+ ]]; then FULL=true
            fi
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Build matrix values
        run: |
          if [[ "${{ steps.check.outputs.full }}" == "true" ]]; then
            MACOS=$(jq -c . .github/matrices/macos-full.json)
          else
            MACOS=$(jq -c . .github/matrices/macos-spm.json)
          fi
          echo "macos-matrix={\"include\":${MACOS}}" >> "$GITHUB_OUTPUT"

  # Without this leg a stray `import ScriptingBridge` or `Darwin` in the write
  # path regresses portability silently.
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-6.4.x-noble
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        id: build

  build-macos:
    name: Build on macOS
    needs: configure
    runs-on: ${{ matrix.runs-on }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.macos-matrix) }}
    steps:
      - uses: actions/checkout@v6
      # No `scheme:` here on purpose. Passing the product name skips the
      # action's "Calculate Scheme" step, and `-scheme KeynoteKit` resolves to
      # something xcodebuild reports as having no supported platforms. SwiftPM
      # names the aggregate scheme `KeynoteKit-Package`; letting the action
      # derive it gets that right.
      - uses: brightdigit/swift-build@v1
        id: build
        with:
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}

  lint:
    name: Linting
    if: ${{ !cancelled() && !failure() && !contains(github.event.head_commit.message, 'ci skip') }}
    needs: [build-ubuntu, build-macos]
    # SyndiKit lints in an Ubuntu container, but Scripts/lint.sh here ends in
    # `xcrun swift build --build-tests` against DEVELOPER_DIR, so this runs on
    # macOS where that Xcode exists.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tools
      - name: Lint
        run: ./Scripts/lint.sh
        env:
          LINT_MODE: STRICT
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
